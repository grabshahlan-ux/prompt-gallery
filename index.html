<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promptfolio</title>
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Promptfolio">
  <meta name="theme-color" content="#1a1612">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1612; --ink2: #5c5550; --ink3: #9c9490;
      --paper: #faf8f4; --paper2: #f2ede6; --paper3: #e8e0d4;
      --accent: #c17f3a; --accent2: #e8a85a;
      --border: rgba(90,70,50,0.12); --border2: rgba(90,70,50,0.22);
      --success: #4a7c59; --success-bg: #edf5f0;
      --star: #e8a85a;
      --radius: 12px; --radius-lg: 18px; --radius-xl: 24px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

    /* Lock */
    .lock-screen { position: fixed; inset: 0; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; padding: 2rem; }
    .lock-logo { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--paper); margin-bottom: 6px; }
    .lock-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 auto 2rem; }
    .lock-label { font-size: 13px; color: var(--ink3); margin-bottom: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
    .lock-input { width: 100%; max-width: 260px; height: 48px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius); text-align: center; font-size: 22px; letter-spacing: 0.2em; color: #fff; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 12px; }
    .lock-input:focus { border-color: var(--accent); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    .lock-input.error { border-color: #e05050; animation: shake 0.3s ease; }
    .lock-btn { width: 100%; max-width: 260px; height: 46px; background: var(--accent); border: none; border-radius: var(--radius); color: #fff; font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }
    .lock-btn:hover { background: var(--accent2); }
    .lock-error { font-size: 12px; color: #e05050; margin-top: 10px; opacity: 0; transition: opacity 0.2s; }
    .lock-error.show { opacity: 1; }
    .lock-footer { position: absolute; bottom: 2rem; font-size: 10px; color: rgba(255,255,255,0.15); letter-spacing: 0.15em; }

    .app { display: none; }
    .app.unlocked { display: block; }

    /* Header */
    .header { background: var(--ink); padding: 0 1.5rem; height: 62px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 400; color: var(--paper); }
    .logo-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .count-pill { font-size: 11px; color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 2px 9px; border-radius: 20px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); pointer-events: none; }
    .search-input { height: 35px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 0 13px 0 30px; font-size: 13px; color: #fff; font-family: 'DM Sans', sans-serif; width: 155px; outline: none; transition: all 0.2s; }
    .search-input::placeholder { color: rgba(255,255,255,0.28); }
    .search-input:focus { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); width: 185px; }
    .btn-add { height: 35px; padding: 0 15px; background: var(--accent); border: none; border-radius: 20px; color: #fff; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; transition: background 0.2s; }
    .btn-add:hover { background: var(--accent2); }

    /* Filter */
    .filter-bar { background: var(--paper2); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; }
    .filter-bar.open { max-height: 120px; padding: 0.7rem 1.5rem; }
    .filter-label { font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.09em; font-weight: 500; }
    .filter-tag { height: 27px; padding: 0 11px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; font-size: 11px; font-weight: 500; color: var(--ink2); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .filter-tag:hover { background: var(--paper3); }
    .filter-tag.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .filter-tag.fav-filter { color: var(--star); border-color: rgba(232,168,90,0.35); }
    .filter-tag.fav-filter.active { background: var(--star); color: #fff; border-color: var(--star); }
    .btn-tags { height: 35px; padding: 0 13px; background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; color: rgba(255,255,255,0.6); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; display: none; align-items: center; gap: 5px; transition: all 0.15s; }
    .btn-tags.visible { display: flex; }
    .btn-tags:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .btn-tags.open { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.3); }
    .btn-tags .arrow { font-size: 10px; transition: transform 0.25s; display: inline-block; }
    .btn-tags.open .arrow { transform: rotate(180deg); }

    /* Grid */
    .container { padding: 1.25rem 1.5rem 4rem; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 14px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; position: relative; transition: transform 0.2s, box-shadow 0.2s; animation: fadeUp 0.3s ease both; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(90,70,50,0.11); }
    .card-img-wrap { aspect-ratio: 4/3; background: var(--paper2); overflow: hidden; position: relative; cursor: pointer; }
    .card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s; }
    .card:hover .card-img { transform: scale(1.05); }
    .card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 38px; background: var(--paper2); cursor: pointer; }
    .star-btn { position: absolute; top: 7px; left: 7px; width: 28px; height: 28px; border-radius: 50%; background: rgba(26,22,18,0.5); backdrop-filter: blur(3px); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; transition: all 0.15s; }
    .star-btn.starred { background: rgba(232,168,90,0.9); color: #fff; border-color: rgba(232,168,90,0.5); }
    .star-btn:hover { background: rgba(232,168,90,0.75); color: #fff; }
    .delete-btn { position: absolute; top: 7px; right: 7px; width: 27px; height: 27px; border-radius: 50%; background: rgba(26,22,18,0.55); backdrop-filter: blur(3px); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 11px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 2; transition: background 0.15s; }
    .card:hover .delete-btn { display: flex; }
    .delete-btn:hover { background: rgba(180,55,55,0.75); }
    .card-body { padding: 11px 12px 12px; }
    .tag { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: #fdf4e8; color: var(--accent); border: 1px solid rgba(193,127,58,0.2); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
    .card-prompt { font-size: 12px; color: var(--ink2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 300; cursor: pointer; }
    .card-prompt:hover { color: var(--ink); }
    .card-actions { display: flex; gap: 6px; margin-top: 9px; }
    .copy-btn { flex: 1; height: 31px; border: 1px solid var(--border2); border-radius: var(--radius); background: transparent; font-size: 11px; font-weight: 500; color: var(--ink2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .copy-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .copy-btn.copied { background: var(--success-bg); color: var(--success); border-color: rgba(74,124,89,0.3); }
    .edit-btn { width: 31px; height: 31px; border: 1px solid var(--border2); border-radius: var(--radius); background: transparent; font-size: 14px; color: var(--ink2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
    .edit-btn:hover { background: var(--paper2); color: var(--ink); }

    /* Empty */
    .empty { grid-column: 1/-1; text-align: center; padding: 5rem 1rem; }
    .empty-icon { font-size: 44px; opacity: 0.3; margin-bottom: 1rem; }
    .empty h3 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 400; color: var(--ink2); margin-bottom: 8px; }
    .empty p { font-size: 13px; color: var(--ink3); font-weight: 300; }

    /* Modal base */
    .modal-overlay { position: fixed; inset: 0; background: rgba(26,22,18,0.55); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    @media (min-width: 520px) { .modal-overlay { align-items: center; } .modal-handle { display: none !important; } }
    .modal-sheet { background: var(--paper); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 0 1.5rem 2.5rem; width: 100%; max-width: 460px; transform: translateY(40px); transition: transform 0.3s cubic-bezier(0.34,1.06,0.64,1); max-height: 92vh; overflow-y: auto; }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }
    @media (min-width: 520px) { .modal-sheet { border-radius: var(--radius-xl); transform: scale(0.97) translateY(8px); transition: transform 0.25s; padding-bottom: 1.75rem; } .modal-overlay.open .modal-sheet { transform: scale(1) translateY(0); } }
    .modal-handle { width: 34px; height: 4px; background: var(--border2); border-radius: 2px; margin: 14px auto 1.25rem; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 400; }
    .modal-close { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border2); background: transparent; color: var(--ink2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-close:hover { background: var(--paper2); }
    .form-group { margin-bottom: 1rem; }
    .form-label { font-size: 10px; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.09em; display: block; margin-bottom: 6px; }
    .file-drop { border: 1.5px dashed var(--border2); border-radius: var(--radius); height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; color: var(--ink2); cursor: pointer; background: var(--paper2); transition: all 0.15s; }
    .file-drop:hover { border-color: var(--accent); color: var(--accent); background: #fdf6ec; }
    .file-sub { font-size: 11px; color: var(--ink3); }
    .preview-img { width: 100%; height: 145px; object-fit: cover; border-radius: var(--radius); display: none; margin-bottom: 1rem; }
    .form-input, .form-textarea { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; color: var(--ink); background: #fff; font-family: 'DM Sans', sans-serif; font-weight: 300; outline: none; transition: border-color 0.15s; }
    .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { height: 96px; resize: none; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; margin-top: 1.25rem; }
    .btn-cancel { flex: 1; height: 46px; border: 1px solid var(--border2); border-radius: var(--radius); background: transparent; font-size: 14px; color: var(--ink2); cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .btn-cancel:hover { background: var(--paper2); }
    .btn-save { flex: 2; height: 46px; border: none; border-radius: var(--radius); background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
    .btn-save:hover { background: var(--accent); }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

    /* View modal extras */
    .view-img { width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius-lg); margin-bottom: 1.25rem; display: none; }
    .view-tag { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 9px; border-radius: 20px; background: #fdf4e8; color: var(--accent); border: 1px solid rgba(193,127,58,0.2); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
    .view-prompt-box { font-size: 14px; color: var(--ink2); line-height: 1.75; font-weight: 300; background: var(--paper2); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); margin-bottom: 1.25rem; word-break: break-word; white-space: pre-wrap; }
    .view-copy-btn { width: 100%; height: 46px; border: none; border-radius: var(--radius); background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
    .view-copy-btn:hover { background: var(--accent); }
    .view-copy-btn.copied { background: var(--success); }

    /* Toast */
    .toast { position: fixed; bottom: 1.75rem; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 300; opacity: 0; pointer-events: none; transition: all 0.25s; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .header { padding: 0 1rem; }
      .search-input { width: 110px; }
      .search-input:focus { width: 130px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
      .container { padding: 1rem 1rem 4rem; }
      .filter-bar { padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>

<!-- Lock screen -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-logo">Promptfolio</div>
  <div class="lock-dot"></div>
  <p class="lock-label">Enter your password</p>
  <input class="lock-input" type="password" id="lockInput" placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter') checkPassword()">
  <button class="lock-btn" onclick="checkPassword()">Unlock</button>
  <p class="lock-error" id="lockError">Incorrect password. Try again.</p>
  <p class="lock-footer">PROMPTFOLIO · PRIVATE</p>
</div>

<!-- App -->
<div class="app" id="app">
  <header class="header">
    <div class="logo">
      <span class="logo-text">Promptfolio</span>
      <div class="logo-dot"></div>
      <span class="count-pill" id="count">0 prompts</span>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input class="search-input" type="text" placeholder="Search..." id="search" oninput="filterCards()">
      </div>
      <button class="btn-tags" id="btn-tags" onclick="toggleFilterBar()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M4 8h8M6 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Tags <span class="arrow">▾</span>
      </button>
      <button class="btn-add" onclick="openAddModal()">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add
      </button>
    </div>
  </header>
  <div class="filter-bar" id="filter-bar"><span class="filter-label">Filter</span></div>
  <div class="container"><div class="grid" id="grid"><div class="empty"><div class="empty-icon">✦</div><h3>Loading your collection...</h3></div></div></div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 class="modal-title">New entry</h2>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <img id="preview-img" class="preview-img" alt="preview">
    <div class="form-group">
      <label class="form-label">Image</label>
      <label class="file-drop" for="file-input" id="file-label">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3v10M6 7l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Tap to upload image</span><span class="file-sub">JPG, PNG, WEBP</span>
      </label>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="previewFile(event)">
    </div>
    <div class="form-group">
      <label class="form-label">Tag <span style="opacity:0.45;font-weight:300;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="text" class="form-input" id="m-tag" placeholder="e.g. landscape, portrait">
    </div>
    <div class="form-group">
      <label class="form-label">Prompt</label>
      <textarea class="form-textarea" id="m-prompt" placeholder="Paste your AI prompt here..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn-save" id="save-btn" onclick="saveEntry()">Save entry</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 class="modal-title">Edit entry</h2>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Tag <span style="opacity:0.45;font-weight:300;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="text" class="form-input" id="edit-tag" placeholder="e.g. landscape, portrait">
    </div>
    <div class="form-group">
      <label class="form-label">Prompt</label>
      <textarea class="form-textarea" id="edit-prompt" style="height:140px" placeholder="Edit your prompt here..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      <button class="btn-save" id="edit-save-btn" onclick="saveEdit()">Save changes</button>
    </div>
  </div>
</div>

<!-- View Prompt Modal -->
<div class="modal-overlay" id="viewModal">
  <div class="modal-sheet" style="max-width:500px">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 class="modal-title">Full prompt</h2>
      <button class="modal-close" onclick="closeViewModal()">✕</button>
    </div>
    <img id="view-img" class="view-img" alt="">
    <div id="view-tag-wrap"></div>
    <p class="view-prompt-box" id="view-prompt-text"></p>
    <button class="view-copy-btn" id="view-copy-btn" onclick="copyFromView()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 11H2a1 1 0 01-1-1V2a1 1 0 011-1h8a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/></svg>
      Copy prompt
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = "https://bkzrpgztlehysbazmqcw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrenJwZ3p0bGVoeXNiYXptcWN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MDc2MzQsImV4cCI6MjA4OTE4MzYzNH0.NEwCBb_AUtmQWu0n1zRmYrNVA7J_QZMnOuuitRdCn2Q";
  const H = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };
  const PASSWORD = "2424";

  function checkPassword() {
    const val = document.getElementById('lockInput').value;
    const inp = document.getElementById('lockInput');
    if (val === PASSWORD) {
      sessionStorage.setItem('pf_unlocked', '1');
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('app').classList.add('unlocked');
      loadEntries();
    } else {
      inp.classList.add('error');
      document.getElementById('lockError').classList.add('show');
      setTimeout(() => { inp.classList.remove('error'); inp.value = ''; }, 600);
    }
  }

  if (sessionStorage.getItem('pf_unlocked')) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').classList.add('unlocked');
  }

  let allEntries = [], selectedFile = null, activeFilter = 'all', editingId = null, viewingId = null;

  function getFavs() { try { return JSON.parse(localStorage.getItem('pf_favs') || '[]'); } catch { return []; } }
  function saveFavs(f) { localStorage.setItem('pf_favs', JSON.stringify(f)); }
  function isFav(id) { return getFavs().includes(id); }
  function toggleFav(id) { let f = getFavs(); f.includes(id) ? f = f.filter(x => x !== id) : f.push(id); saveFavs(f); return f.includes(id); }

  async function loadEntries() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/prompts?order=created_at.desc`, { headers: H });
      if (!res.ok) throw new Error(await res.text());
      allEntries = await res.json();
      buildFilterTags();
      renderGrid(getFiltered());
      document.getElementById('count').textContent = allEntries.length + ' prompt' + (allEntries.length !== 1 ? 's' : '');
    } catch(e) {
      document.getElementById('grid').innerHTML = `<div class="empty"><div class="empty-icon">⚠</div><h3>Could not connect</h3><p>Check your internet and try again.</p></div>`;
    }
  }

  function buildFilterTags() {
    const tags = [...new Set(allEntries.map(e => e.tag).filter(Boolean))];
    const bar = document.getElementById('filter-bar');
    const tagsBtn = document.getElementById('btn-tags');
    bar.innerHTML = '<span class="filter-label">Filter</span>';
    const hasFavs = getFavs().length > 0;
    if (!tags.length && !hasFavs) { tagsBtn.classList.remove('visible'); bar.classList.remove('open'); return; }
    tagsBtn.classList.add('visible');
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-tag' + (activeFilter === 'all' ? ' active' : '');
    allBtn.textContent = 'All';
    allBtn.onclick = () => setFilter('all', allBtn);
    bar.appendChild(allBtn);
    if (hasFavs) {
      const fb = document.createElement('button');
      fb.className = 'filter-tag fav-filter' + (activeFilter === 'favs' ? ' active' : '');
      fb.innerHTML = '★ Favourites';
      fb.onclick = () => setFilter('favs', fb);
      bar.appendChild(fb);
    }
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag' + (activeFilter === tag ? ' active' : '');
      btn.textContent = tag;
      btn.onclick = () => setFilter(tag, btn);
      bar.appendChild(btn);
    });
  }

  function toggleFilterBar() {
    const bar = document.getElementById('filter-bar');
    const btn = document.getElementById('btn-tags');
    const isOpen = bar.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
  }

  function setFilter(tag, btn) {
    activeFilter = tag;
    document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(getFiltered());
  }

  function getFiltered() {
    const q = document.getElementById('search').value.toLowerCase();
    return allEntries.filter(e => {
      const matchTag = activeFilter === 'all' || (activeFilter === 'favs' ? isFav(e.id) : e.tag === activeFilter);
      const matchSearch = !q || e.prompt.toLowerCase().includes(q) || (e.tag||'').toLowerCase().includes(q);
      return matchTag && matchSearch;
    });
  }

  function filterCards() { renderGrid(getFiltered()); }

  function imgUrl(path) {
    if (!path) return null;
    if (path.startsWith('http')) return path;
    return `${SUPABASE_URL}/storage/v1/object/public/images/${path}`;
  }

  function renderGrid(list) {
    const grid = document.getElementById('grid');
    if (!list.length) {
      grid.innerHTML = `<div class="empty"><div class="empty-icon">✦</div><h3>${allEntries.length ? 'Nothing found' : 'Your collection awaits'}</h3><p>${allEntries.length ? 'Try a different search or filter.' : 'Tap "+ Add" to save your first prompt.'}</p></div>`;
      return;
    }
    grid.innerHTML = list.map((e, i) => {
      const url = imgUrl(e.image_url);
      const fav = isFav(e.id);
      return `<div class="card" style="animation-delay:${Math.min(i*0.05,0.4)}s">
        <div class="card-img-wrap" onclick="openViewModal('${e.id}')">
          ${url ? `<img class="card-img" src="${url}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
          <div class="card-placeholder" style="${url?'display:none':''}">🖼️</div>
          <button class="star-btn ${fav?'starred':''}" onclick="event.stopPropagation();handleStar(this,'${e.id}')" title="Favourite">★</button>
          <button class="delete-btn" onclick="event.stopPropagation();deleteEntry('${e.id}')">✕</button>
        </div>
        <div class="card-body">
          ${e.tag?`<div><span class="tag">${e.tag}</span></div>`:''}
          <p class="card-prompt" onclick="openViewModal('${e.id}')">${e.prompt}</p>
          <div class="card-actions">
            <button class="copy-btn" id="copy-${e.id}" onclick="copyPrompt(this,'${e.id}')">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 11H2a1 1 0 01-1-1V2a1 1 0 011-1h8a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/></svg>
              Copy
            </button>
            <button class="edit-btn" onclick="openEditModal('${e.id}')" title="Edit">✎</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function handleStar(btn, id) {
    const nowFav = toggleFav(id);
    btn.classList.toggle('starred', nowFav);
    showToast(nowFav ? '★ Added to favourites' : 'Removed from favourites');
    buildFilterTags();
    if (activeFilter === 'favs') renderGrid(getFiltered());
  }

  function copyPrompt(btn, id) {
    const e = allEntries.find(x => x.id === id);
    if (!e) return;
    navigator.clipboard.writeText(e.prompt).then(() => {
      btn.classList.add('copied');
      btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M2 8l4 4 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Copied!';
      showToast('Prompt copied ✓');
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 11H2a1 1 0 01-1-1V2a1 1 0 011-1h8a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/></svg> Copy'; }, 2500);
    });
  }

  function openViewModal(id) {
    viewingId = id;
    const e = allEntries.find(x => x.id === id);
    if (!e) return;
    const url = imgUrl(e.image_url);
    const img = document.getElementById('view-img');
    img.style.display = url ? 'block' : 'none';
    if (url) img.src = url;
    document.getElementById('view-tag-wrap').innerHTML = e.tag ? `<span class="view-tag">${e.tag}</span>` : '';
    document.getElementById('view-prompt-text').textContent = e.prompt;
    const btn = document.getElementById('view-copy-btn');
    btn.classList.remove('copied');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 11H2a1 1 0 01-1-1V2a1 1 0 011-1h8a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/></svg> Copy prompt';
    document.getElementById('viewModal').classList.add('open');
  }
  function closeViewModal() { document.getElementById('viewModal').classList.remove('open'); }
  function copyFromView() {
    const e = allEntries.find(x => x.id === viewingId);
    if (!e) return;
    navigator.clipboard.writeText(e.prompt).then(() => {
      const btn = document.getElementById('view-copy-btn');
      btn.classList.add('copied');
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8l4 4 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Copied!';
      showToast('Prompt copied ✓');
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 11H2a1 1 0 01-1-1V2a1 1 0 011-1h8a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/></svg> Copy prompt'; }, 2500);
    });
  }

  function openEditModal(id) {
    editingId = id;
    const e = allEntries.find(x => x.id === id);
    if (!e) return;
    document.getElementById('edit-tag').value = e.tag || '';
    document.getElementById('edit-prompt').value = e.prompt || '';
    document.getElementById('editModal').classList.add('open');
  }
  function closeEditModal() { document.getElementById('editModal').classList.remove('open'); editingId = null; }
  async function saveEdit() {
    const prompt = document.getElementById('edit-prompt').value.trim();
    if (!prompt) { showToast('Prompt cannot be empty'); return; }
    const btn = document.getElementById('edit-save-btn');
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/prompts?id=eq.${editingId}`, {
        method: 'PATCH', headers: { ...H, "Prefer": "return=minimal" },
        body: JSON.stringify({ prompt, tag: document.getElementById('edit-tag').value.trim() || null })
      });
      if (!res.ok) throw new Error(await res.text());
      showToast('Changes saved!'); closeEditModal(); loadEntries();
    } catch(e) { showToast('Save failed: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = 'Save changes'; }
  }

  function openAddModal() { document.getElementById('addModal').classList.add('open'); }
  function closeAddModal() {
    document.getElementById('addModal').classList.remove('open');
    document.getElementById('m-prompt').value = ''; document.getElementById('m-tag').value = '';
    document.getElementById('preview-img').style.display = 'none';
    document.getElementById('file-label').innerHTML = `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3v10M6 7l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Tap to upload image</span><span class="file-sub">JPG, PNG, WEBP</span>`;
    document.getElementById('file-input').value = ''; selectedFile = null;
  }

  function previewFile(e) {
    selectedFile = e.target.files[0]; if (!selectedFile) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = document.getElementById('preview-img'); img.src = ev.target.result; img.style.display = 'block';
      document.getElementById('file-label').innerHTML = `<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 12l3.5-3.5 3 3L14 8l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="color:var(--accent);font-weight:500">${selectedFile.name}</span><span class="file-sub">Tap to change</span>`;
    };
    reader.readAsDataURL(selectedFile);
  }

  async function uploadImage(file) {
    const ext = file.name.split('.').pop();
    const path = `${Date.now()}.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/images/${path}`, {
      method: 'POST', headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": file.type }, body: file
    });
    if (!res.ok) throw new Error(await res.text());
    return path;
  }

  async function saveEntry() {
    const prompt = document.getElementById('m-prompt').value.trim();
    if (!prompt) { showToast('Please enter a prompt'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      let image_url = null;
      if (selectedFile) image_url = await uploadImage(selectedFile);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/prompts`, {
        method: 'POST', headers: { ...H, "Prefer": "return=minimal" },
        body: JSON.stringify({ prompt, tag: document.getElementById('m-tag').value.trim() || null, image_url })
      });
      if (!res.ok) throw new Error(await res.text());
      showToast('Entry saved!'); closeAddModal(); loadEntries();
    } catch(e) { showToast('Save failed: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = 'Save entry'; }
  }

  async function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/prompts?id=eq.${id}`, { method: 'DELETE', headers: H });
      if (!res.ok) throw new Error(await res.text());
      showToast('Entry deleted'); loadEntries();
    } catch(e) { showToast('Delete failed'); }
  }

  function showToast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  ['addModal','editModal','viewModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });
  });

  if (sessionStorage.getItem('pf_unlocked')) loadEntries();
</script>
</body>
</html>
