<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e8956d"/>
      <stop offset="50%" stop-color="#c17f3a"/>
      <stop offset="100%" stop-color="#8b4a1a"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7a3010" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)" filter="url(#shadow)"/>
  <rect width="512" height="512" rx="110" ry="110" fill="url(#shine)"/>

  <!-- Decorative dots top right -->
  <circle cx="390" cy="80" r="8" fill="#fff" opacity="0.25"/>
  <circle cx="418" cy="62" r="5" fill="#fff" opacity="0.18"/>
  <circle cx="408" cy="100" r="4" fill="#fff" opacity="0.15"/>

  <!-- Decorative dots bottom left -->
  <circle cx="95" cy="420" r="7" fill="#fff" opacity="0.2"/>
  <circle cx="72" cy="445" r="4" fill="#fff" opacity="0.14"/>
  <circle cx="118" cy="448" r="5" fill="#fff" opacity="0.16"/>

  <!-- Small star/sparkle top left -->
  <g transform="translate(88, 88)" opacity="0.35">
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9" y1="-9" x2="-9" y2="9" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Small sparkle bottom right -->
  <g transform="translate(424, 424)" opacity="0.28">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Letter P - warm elegant serif style -->
  <g filter="url(#shadow)">
    <!-- P stem -->
    <rect x="158" y="148" width="48" height="216" rx="12" fill="#fff"/>
    <!-- P bowl -->
    <path d="M196 148 Q340 148 340 224 Q340 300 196 300 L196 252 Q292 252 292 224 Q292 196 196 196 Z" fill="#fff"/>
  </g>

  <!-- Subtle bottom text -->
  <text x="256" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="400" fill="#fff" opacity="0.45" letter-spacing="8">PROMPTFOLIO</text>
</svg>
